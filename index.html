
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JackFlix</title>
<style>
body{margin:0;background:#101014;color:white;font-family:Arial}
header{background:#1d1d25;padding:20px;color:#ff3038;font-size:30px;font-weight:bold}
main{padding:16px}
input{width:95%;padding:12px;border-radius:8px;border:0;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:#22222b;padding:10px;border-radius:9px}
img{width:100%;aspect-ratio:2/3;object-fit:cover}
button{background:#e50914;color:white;border:0;padding:10px;border-radius:6px;width:100%}
p{color:#bbb;font-size:13px}
</style>
</head>
<body>
<header>JackFlix 🎬</header>
<main>
<h2>Discover Movies</h2>
<input id="search" placeholder="Search movies...">
<div class="grid" id="movies"></div>
</main>
<script>
const films=[
{title:"Movie One",year:"2026",poster:"https://placehold.co/300x450/22222b/ffffff?text=Movie+1",link:""},
{title:"Movie Two",year:"2026",poster:"https://placehold.co/300x450/22222b/ffffff?text=Movie+2",link:""},
{title:"Movie Three",year:"2025",poster:"https://placehold.co/300x450/22222b/ffffff?text=Movie+3",link:""},
{title:"Movie Four",year:"2025",poster:"https://placehold.co/300x450/22222b/ffffff?text=Movie+4",link:""}
];
function show(){
let q=document.getElementById("search").value.toLowerCase();
document.getElementById("movies").innerHTML=films.filter(f=>f.title.toLowerCase().includes(q)).map(f=>`
<div class="card">
<img src="${f.poster}" alt="Movie poster">
<h3>${f.title}</h3><p>${f.year}</p>
${f.link?`<a href="${f.link}" target="_blank"><button>⬇ Download</button></a>`:`<button disabled>Link coming soon</button>`}
</div>`).join("");
}
document.getElementById("search").addEventListener("input",show);
show();
</script>
</body>
</html>
