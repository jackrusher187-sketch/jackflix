
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JackFlix — Discover Movies</title>
<style>
:root{--bg:#0b0b0f;--panel:#17171e;--red:#f52235;--muted:#a4a4b1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}
header{background:#111116;border-bottom:1px solid #292931;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:29px;font-weight:900;color:var(--red)}
.logo span{color:#fff}
header small{color:var(--muted)}
.hero{padding:42px 5% 28px;background:linear-gradient(120deg,#271015,#111116 65%)}
.hero h1{font-size:clamp(30px,6vw,48px);margin:0 0 12px}
.hero h1 span{color:var(--red)}
.hero p{color:#c0c0ca;line-height:1.6;max-width:540px}
.search{width:100%;max-width:550px;padding:15px;border:1px solid #393943;border-radius:9px;background:#191920;color:white;font-size:16px}
main{padding:22px 5% 40px}
.categories{display:flex;gap:9px;overflow-x:auto;padding:4px 0 18px}
.categories button{white-space:nowrap;border:1px solid #33333c;background:#191920;color:#eee;padding:10px 15px;border-radius:22px;cursor:pointer}
.categories button.active,.categories button:hover{background:var(--red);border-color:var(--red)}
.section-title{font-size:22px;margin:10px 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--panel);border:1px solid #292931;border-radius:10px;overflow:hidden;min-width:0}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#24242d}
.details{padding:11px}
.details h3{font-size:15px;margin:0 0 8px;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:12px}
.download{display:block;text-align:center;padding:11px 5px;background:var(--red);color:white;text-decoration:none;border-radius:6px;font-weight:bold;font-size:13px}
.disabled{display:block;text-align:center;padding:11px 5px;background:#34343d;color:#c5c5cd;border-radius:6px;font-size:13px}
.empty{color:var(--muted);grid-column:1/-1;padding:25px 0}
footer{border-top:1px solid #292931;text-align:center;color:var(--muted);padding:24px;font-size:12px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:950px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div class="logo">Jack<span>Flix</span></div>
  <small>YOUR MOVIE DESTINATION</small>
</header>

<section class="hero">
  <h1>Discover your next <span>favourite.</span></h1>
  <p>Explore movies, browse categories and find movie information in one place.</p>
  <input id="search" class="search" placeholder="🔍 Search movies..." aria-label="Search movies">
</section>

<main>
  <nav class="categories" id="categories" aria-label="Movie categories">
    <button class="active" data-category="All">All Movies</button>
    <button data-category="Bollywood">Bollywood</button>
    <button data-category="Hollywood">Hollywood</button>
    <button data-category="South">South</button>
    <button data-category="Web Series">Web Series</button>
  </nav>

  <h2 class="section-title">Explore Movies 🍿</h2>
  <div class="grid" id="movies"></div>
</main>

<footer>© 2026 JackFlix · Movie discovery made simple</footer>

<script>
const movies = [
 {title:"Sample Movie One",year:"2026",category:"Bollywood",language:"Hindi",quality:"1080p",poster:"https://placehold.co/400x600/21151b/ffffff?text=Movie+Poster",link:""},
 {title:"Sample Movie Two",year:"2026",category:"Hollywood",language:"English",quality:"720p",poster:"https://placehold.co/400x600/171c2a/ffffff?text=Movie+Poster",link:""},
 {title:"Sample Movie Three",year:"2025",category:"South",language:"Hindi Dubbed",quality:"1080p",poster:"https://placehold.co/400x600/20241b/ffffff?text=Movie+Poster",link:""},
 {title:"Sample Web Series",year:"2026",category:"Web Series",language:"Hindi",quality:"1080p",poster:"https://placehold.co/400x600/201a2a/ffffff?text=Series+Poster",link:""}
];

let activeCategory = "All";

function renderMovies(){
  const query = document.getElementById("search").value.trim().toLowerCase();
  const filtered = movies.filter(m =>
    m.title.toLowerCase().includes(query) &&
    (activeCategory === "All" || m.category === activeCategory)
  );

  const container = document.getElementById("movies");
  container.replaceChildren();

  if(!filtered.length){
    const msg = document.createElement("p");
    msg.className = "empty";
    msg.textContent = "No movies found. Try another search.";
    container.appendChild(msg);
    return;
  }

  filtered.forEach(m => {
    const card = document.createElement("article");
    card.className = "card";

    const poster = document.createElement("img");
    poster.className = "poster";
    poster.src = m.poster;
    poster.alt = m.title + " poster";
    poster.loading = "lazy";

    const details = document.createElement("div");
    details.className = "details";

    const title = document.createElement("h3");
    title.textContent = m.title;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${m.year} · ${m.category} · ${m.language} · ${m.quality}`;

    details.append(title, meta);

    if(m.link){
      const link = document.createElement("a");
      link.className = "download";
      link.href = m.link;
      link.textContent = "Download";
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      details.appendChild(link);
    }else{
      const label = document.createElement("span");
      label.className = "disabled";
      label.textContent = "Link coming soon";
      details.appendChild(label);
    }

    card.append(poster, details);
    container.appendChild(card);
  });
}

document.getElementById("search").addEventListener("input", renderMovies);

document.getElementById("categories").addEventListener("click", e => {
  const button = e.target.closest("button[data-category]");
  if(!button) return;
  activeCategory = button.dataset.category;
  document.querySelectorAll("#categories button").forEach(b =>
    b.classList.toggle("active", b === button)
  );
  renderMovies();
});

renderMovies();
</script>
</body>
</html>
